name: Admin task

# Runs one Vault-admin operation on a system's site listings (src/admin-tasks.ts), so it doesn't need someone
# signed in to the portal: import listings, copy site images to the Vault CDN, move a game to another studio, edit
# and publish listings in bulk, release a test build, make the smaller copies of listing images (image-variants: args
# {} or {"redo": true}), or list listings to check the result. The job runs in the
# chosen system's GitHub environment, and its OIDC token is what that system's portal accepts (like check-games and
# releases); there are no secrets. It is a dry run unless dry_run is unticked: the result (what changed, or would) is in the job summary.
#
#   gh workflow run admin-task.yml -f environment=staging -f task=move -f args='{"slug":"shady-sam","studio":"ngpf"}' -f dry_run=false
#
# See "Admin tasks" in README.md for each task's args.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which system to change
        type: choice
        options: [staging, production]
        default: staging
      task:
        description: What to do
        type: choice
        options: [list, import, migrate-images, move, update, featured, studios, release, image-variants]
        required: true
      args:
        description: The task's arguments, as a JSON object
        type: string
        default: '{}'
      dry_run:
        description: Only report what would change
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  run:
    # Runs in the system's environment: its variables, and an OIDC token that system's portal accepts.
    environment: ${{ inputs.environment }}
    # One task per system at a time.
    concurrency: admin-task-${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORTAL: ${{ vars.PORTAL_URL }}
      TASK: ${{ inputs.task }}
      ARGS: ${{ inputs.args }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    # The script asks GitHub for the OIDC token (audience vault-publisher) itself, so each call gets a fresh one.
    # image-variants resizes images here (sharp, a dev dependency), so it needs the install; the others need nothing.
    - name: Make the smaller copies of the listing images
      if: inputs.task == 'image-variants'
      run: |
        npm ci
        redo=$(node -e 'process.stdout.write(JSON.parse(process.env.ARGS || "{}").redo ? "--redo" : "")')
        node scripts/image-variants.ts --portal "$PORTAL" --dry-run="$DRY_RUN" $redo --summary "$GITHUB_STEP_SUMMARY"

    - name: Run the task
      if: inputs.task != 'image-variants'
      run: node scripts/admin-task.ts --portal "$PORTAL" --task "$TASK" --args "$ARGS" --dry-run="$DRY_RUN" --summary "$GITHUB_STEP_SUMMARY"
