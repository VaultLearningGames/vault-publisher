name: Deploy (portal)

# The PORTAL only. The website is built and published by VaultLearningGames/vault-site (its "Deploy (site)" workflow),
# which is the sole publisher of the site Workers. This workflow must never publish to them: when it did, a portal
# push replaced the site with a build that had no blog posts.
#   main        → staging     vault-publisher-staging  https://portal.vaultlearninggames-staging.org
#   production  → production  vault-publisher          https://portal.vaultlearninggames.org
# Flow: portal (edit) → commit to vault-site's staging/production branch → vault-site builds → Cloudflare Worker.
# The portal image carries vault-site at vault-site.ref (for previews) and Hugo.
# Each GitHub environment ("staging", "production") holds that system's variables. One-time setup: docs/setup.md
on:
  workflow_dispatch:
    inputs:
      environment:
        description: System to deploy
        type: choice
        options: [staging, production]
        default: staging
  push:
    branches: [ main, production ]

# Never run two deploys of one system at once: only one instance may write its SQLite database. (For the whole run,
# not one job: its jobs share the group, and a job-level group would have them cancel each other.)
concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || (github.ref_name == 'production' && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  portal:
    name: Portal (${{ inputs.environment || (github.ref_name == 'production' && 'production' || 'staging') }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'production' && 'production' || 'staging') }}

    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
    # An environment falls back to repository variables for anything it doesn't set, so a missing staging
    # variable would quietly pick up production's. Refuse to deploy unless every value belongs to this system.
    - name: Check the variables belong to this system
      env:
        TARGET: ${{ inputs.environment || (github.ref_name == 'production' && 'production' || 'staging') }}
        SERVICE: ${{ vars.SERVICE }}
        PUBLISHER_SERVICE_ACCOUNT: ${{ vars.PUBLISHER_SERVICE_ACCOUNT }}
        VALUES: ${{ vars.BUILDS_BUCKET }} ${{ vars.BUILDS_PUBLIC_URL }} ${{ vars.CDN_BUCKET }} ${{ vars.CDN_PUBLIC_URL }} ${{ vars.PORTAL_URL }} ${{ vars.LITESTREAM_BUCKET }} ${{ vars.SITE_URL }}
      run: |
        set -eu
        case "$TARGET:$SERVICE" in production:vault-publisher|staging:vault-publisher-staging) ;; *) echo "::error::SERVICE is '$SERVICE' in the $TARGET environment"; exit 1 ;; esac
        case "$PUBLISHER_SERVICE_ACCOUNT" in "$SERVICE"@*) ;; *) echo "::error::PUBLISHER_SERVICE_ACCOUNT '$PUBLISHER_SERVICE_ACCOUNT' isn't $SERVICE's"; exit 1 ;; esac
        [ "$(echo $VALUES | wc -w)" -eq 7 ] || { echo "::error::a bucket, URL, LITESTREAM_BUCKET or SITE_URL variable is missing"; exit 1; }
        for v in $VALUES; do
          case "$TARGET:$v" in staging:*staging*|production:*) ;; *) echo "::error::$v isn't a staging value"; exit 1 ;; esac
          case "$TARGET:$v" in production:*staging*) echo "::error::$v is a staging value"; exit 1 ;; esac
        done

    - uses: actions/checkout@v7

    # The portal image carries vault-site (private) at the commit pinned in vault-site.ref, for previews.
    - name: Fetch vault-site at the pinned ref
      env:
        VAULT_SITE_READ_TOKEN: ${{ secrets.VAULT_SITE_READ_TOKEN }}
      run: |
        ref="$(grep -v '^[[:space:]]*#' vault-site.ref | tr -d '[:space:]' | head -c 200)"
        [ -n "$ref" ] || { echo "::error::vault-site.ref is empty"; exit 1; }
        [ -n "$VAULT_SITE_READ_TOKEN" ] || { echo "::error::VAULT_SITE_READ_TOKEN is not set"; exit 1; }
        git init -q vault-site-src
        git -C vault-site-src remote add origin https://github.com/VaultLearningGames/vault-site.git
        b64="$(printf 'x-access-token:%s' "$VAULT_SITE_READ_TOKEN" | base64 | tr -d '\n')"
        echo "::add-mask::$b64"
        git -C vault-site-src -c http.extraheader="AUTHORIZATION: basic $b64" fetch -q origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
        git -C vault-site-src checkout -q "$ref^{commit}"
        echo "vault-site $(git -C vault-site-src rev-parse HEAD) (ref $ref)"

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    # The Hugo that builds the site is the one the image renders previews with: the version in the Dockerfile.
    - name: Read the Hugo version from the Dockerfile
      id: hugo
      run: |
        v=$(sed -n 's/^ARG HUGO_VERSION=//p' Dockerfile)
        [ -n "$v" ] || { echo "::error::no ARG HUGO_VERSION in the Dockerfile"; exit 1; }
        echo "version=$v" >> "$GITHUB_OUTPUT"
    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ steps.hugo.outputs.version }}
        extended: true

    # With Hugo installed the tests also render a real preview from the vault-site checkout above (SITE_DIR).
    - run: npm ci && npm run typecheck && npm test
      env:
        SITE_DIR: vault-site-src

    # `github.run_at` is not a GitHub Actions context value — it renders empty, which left the
    # portal's build line with no time at all. Stamp the deploy time here instead.
    - name: Stamp the build time
      id: buildtime
      run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@v3
      with:
        service: ${{ vars.SERVICE }}
        region: ${{ vars.GCP_REGION }}
        project_id: ${{ vars.GCP_PROJECT_ID }}
        source: ./
        # Replace rather than merge, so a revision never keeps variables or secrets removed from this list.
        env_vars_update_strategy: overwrite
        secrets_update_strategy: overwrite
        env_vars: |-
          R2_ACCOUNT_ID=${{ vars.R2_ACCOUNT_ID }}
          BUILDS_BUCKET=${{ vars.BUILDS_BUCKET }}
          BUILDS_PUBLIC_URL=${{ vars.BUILDS_PUBLIC_URL }}
          CDN_BUCKET=${{ vars.CDN_BUCKET }}
          CDN_PUBLIC_URL=${{ vars.CDN_PUBLIC_URL }}
          PORTAL_URL=${{ vars.PORTAL_URL }}
          ADMIN_ENVIRONMENT=${{ vars.ADMIN_ENVIRONMENT }}
          LITESTREAM_BUCKET=${{ vars.LITESTREAM_BUCKET }}
          LITESTREAM_SEED_BUCKET=${{ vars.LITESTREAM_SEED_BUCKET }}
          TASK_INVOKER_EMAIL=${{ vars.TASK_INVOKER_EMAIL }}
          GITHUB_CLIENT_ID=${{ vars.PORTAL_GITHUB_CLIENT_ID }}
          VAULT_ADMINS=${{ vars.VAULT_ADMINS }}
          FORMS_ALLOWED_ORIGINS=${{ vars.FORMS_ALLOWED_ORIGINS }}
          FORMS_NEWSLETTER_SHEET=${{ vars.FORMS_NEWSLETTER_SHEET }}
          FORMS_SUBMIT_GAME_SHEET=${{ vars.FORMS_SUBMIT_GAME_SHEET }}
          SITE_URL=${{ vars.SITE_URL }}
          PREVIEW_SITES=${{ vars.PREVIEW_SITES }}
          SUPPORT_URL=${{ vars.SUPPORT_URL }}
          GA_PROPERTY_ID=${{ vars.GA_PROPERTY_ID }}
          VAULT_SITE_APP_INSTALLATION_ID=${{ vars.SERVICE == 'vault-publisher-staging' && '172505117' || '172505182' }}
          SITE_COMMIT_AUTHOR_NAME=${{ vars.SERVICE == 'vault-publisher-staging' && 'vault-portal-staging[bot]' || 'vault-portal-production[bot]' }}
          SITE_COMMIT_AUTHOR_EMAIL=${{ vars.SERVICE == 'vault-publisher-staging' && '344094146+vault-portal-staging[bot]@users.noreply.github.com' || '344094182+vault-portal-production[bot]@users.noreply.github.com' }}
          VAULT_SITE_APP_BOT_LOGIN=${{ vars.SERVICE == 'vault-publisher-staging' && 'vault-portal-staging[bot]' || 'vault-portal-production[bot]' }}
          SITE_REBUILD_ENVIRONMENT=${{ inputs.environment || (github.ref_name == 'production' && 'production' || 'staging') }}
          # Build identity under the portal's logo (src/build-info.ts): per-revision, so a rollback shows the
          # rolled-back revision's own build. From this run's own context; nothing to set in the environment.
          VAULT_BUILD_NUMBER=${{ github.run_number }}
          VAULT_BUILD_SHA=${{ github.sha }}
          VAULT_BUILD_TIME=${{ steps.buildtime.outputs.iso }}
        secrets: |-
          R2_BUILDS_ACCESS_KEY_ID=${{ vars.SERVICE }}-r2-builds-access-key-id:latest
          R2_BUILDS_SECRET_ACCESS_KEY=${{ vars.SERVICE }}-r2-builds-secret-access-key:latest
          R2_CDN_ACCESS_KEY_ID=${{ vars.SERVICE }}-r2-cdn-access-key-id:latest
          R2_CDN_SECRET_ACCESS_KEY=${{ vars.SERVICE }}-r2-cdn-secret-access-key:latest
          GITHUB_CLIENT_SECRET=${{ vars.SERVICE }}-github-client-secret:latest
          SESSION_SECRET=${{ vars.SERVICE }}-session-secret:latest
          VAULT_SITE_APP_ID=${{ vars.SERVICE }}-vault-site-app-id:latest
          VAULT_SITE_APP_PRIVATE_KEY=${{ vars.SERVICE }}-vault-site-app-private-key:latest
          VAULT_SITE_WEBHOOK_SECRET=${{ vars.SERVICE }}-vault-site-webhook-secret:latest
          ${{ vars.SERVICE == 'vault-publisher-staging' && 'DEPLOY_STATUS_GITHUB_TOKEN=vault-publisher-staging-deploy-status-token:latest' || '' }}
        # The deploy bar's token (Actions: read on both repositories, docs/setup.md "The deploy bar") is staging's only
        # for now; on production the line above is empty, which the action skips.
        # Exactly one instance: SQLite has a single writer, and it stays warm so Litestream isn't restoring on every request.
        # 1Gi: listing previews run Hugo in this container (up to two at once, about 130 MB each, with their
        # files in the in-memory /tmp) next to Node and Litestream.
        flags: >-
          --service-account=${{ vars.PUBLISHER_SERVICE_ACCOUNT }}
          --allow-unauthenticated
          --min-instances=1 --max-instances=1
          --memory=1Gi --cpu-boost

    - name: Show URL
      run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
