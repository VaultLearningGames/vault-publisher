name: Publish preview

# Reusable: publishes a build artifact (from unity-build.yml or any other build) to the staging CDN at
#   https://cdn.vaultlearninggames-staging.org/STUDIO/GAME/<branch or tag>/
# When the calling workflow was triggered by a branch/tag `delete` event, it removes that preview instead.
#
# The caller must grant `permissions: id-token: write`.
#
#   jobs:
#     build:
#       if: github.event_name != 'delete'
#       uses: fielddaylab/vault-publisher/.github/workflows/unity-build.yml@main
#       secrets: inherit
#     preview:
#       needs: build
#       uses: fielddaylab/vault-publisher/.github/workflows/publish-preview.yml@main
#       with: { game: aqualab, artifact: "${{ needs.build.outputs.artifact }}" }
#     remove-preview:
#       if: github.event_name == 'delete'
#       uses: fielddaylab/vault-publisher/.github/workflows/publish-preview.yml@main
#       with: { game: aqualab }
on:
  workflow_call:
    inputs:
      game:
        description: Game slug on the CDN, e.g. "aqualab".
        required: true
        type: string
      artifact:
        description: Name of the artifact holding the build (index.html at its root). Not needed for delete events.
        type: string
        default: ''
      publisher-url:
        description: Overrides the VAULT_PUBLISHER_URL organization variable.
        type: string
        default: ''
    outputs:
      url:
        description: Public URL of the published preview.
        value: ${{ jobs.publish.outputs.url }}

jobs:
  publish:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    concurrency:
      group: vault-preview-${{ github.repository }}-${{ inputs.game }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    # Shows the preview URL on the workflow graph, as "View deployment" on pull requests,
    # and under the repository's Deployments.
    environment:
      name: vault-staging
      url: ${{ steps.publish.outputs.url }}
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
    - name: Check inputs
      if: inputs.artifact == ''
      run: |
        echo "::error::publish-preview needs the 'artifact' input for ${{ github.event_name }} events"
        exit 1

    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: build

    - name: Publish preview
      id: publish
      uses: fielddaylab/vault-publisher/action@main
      with:
        game: ${{ inputs.game }}
        path: build
        publisher-url: ${{ inputs.publisher-url || vars.VAULT_PUBLISHER_URL }}

  delete:
    if: github.event_name == 'delete'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - name: Delete preview
      uses: fielddaylab/vault-publisher/action@main
      with:
        game: ${{ inputs.game }}
        mode: delete
        ref: ${{ github.event.ref }}
        publisher-url: ${{ inputs.publisher-url || vars.VAULT_PUBLISHER_URL }}
