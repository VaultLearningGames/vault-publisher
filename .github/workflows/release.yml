name: Release

# Vault staff release a tested staging build to classrooms (https://cdn.vaultlearninggames.org).
# A check job first shows the reviewer the staging build, its commit and size, and what's live now; then the
# release job runs in the "production" environment, so a required reviewer must approve it.
# The publisher only accepts release actions from this workflow in that environment.
#
#   approve              copy a staging build (usually a tag) into production as an immutable release
#   promote              make an approved release the one players get at .../STUDIO/GAME/ (also used to roll back)
#   approve-and-promote  both, in one run
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [approve-and-promote, approve, promote]
        default: approve-and-promote
      game:
        description: Game slug, e.g. aqualab
        required: true
        type: string
      version:
        description: Release name, e.g. m3.2 (for promote/rollback, an already-approved release)
        required: true
        type: string
      ref:
        description: Staging branch or tag to release (approve only; defaults to the version)
        type: string
        default: ''
      studio:
        description: Studio slug
        type: string
        default: fielddaylab

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.studio }}-${{ inputs.game }}
  cancel-in-progress: false

jobs:
  # Runs before the approval gate: shows the reviewer exactly what they're approving, and stops the run
  # (no approval requested) if it can't succeed.
  check:
    runs-on: ubuntu-latest
    env:
      PUBLISHER: ${{ vars.VAULT_PUBLISHER_URL }}
      ACTION: ${{ inputs.action }}
      STUDIO: ${{ inputs.studio }}
      GAME: ${{ inputs.game }}
      VERSION: ${{ inputs.version }}
      REF: ${{ inputs.ref }}
    steps:
    - name: Check what would be released
      run: |
        set -euo pipefail
        q="action=$(jq -rn --arg v "$ACTION" '$v|@uri')&version=$(jq -rn --arg v "$VERSION" '$v|@uri')&ref=$(jq -rn --arg v "$REF" '$v|@uri')"
        res=$(curl -sS -w '\n%{http_code}' "$PUBLISHER/v1/releases/$STUDIO/$GAME/check?$q")
        code=$(echo "$res" | tail -1); c=$(echo "$res" | sed '$d')
        if [ "$code" != 200 ]; then echo "::error::$(echo "$c" | jq -r '.error // .')"; exit 1; fi
        echo "$c" | jq .
        S="$GITHUB_STEP_SUMMARY"
        {
          echo "## Release check: \`$GAME\` $VERSION ($ACTION)"
          echo
          if [ "$ACTION" != promote ]; then
            url=$(echo "$c" | jq -r '.staging.url // empty')
            if [ -n "$url" ]; then
              status=$(curl -s -o /dev/null -w '%{http_code}' "$url?check=$GITHUB_RUN_ID")
              echo "### ▶ Play the build before approving: $url"
              echo
              echo "| | |"; echo "|---|---|"; table=1
              echo "$c" | jq -r '"| Staging build | `\(.staging.ref)` (\(.staging.ref_type)) · commit `\(.staging.commit_sha[0:7])` |",
                                  "| Size | \(.staging.files) files · \((.staging.bytes/1048576*10|floor)/10) MB |",
                                  "| Published | \(.staging.updated_at[0:16] | sub("T"; " ")) UTC by \(.staging.published_by) from `\(.repository)` |"'
              if [ "$status" = 200 ]; then echo "| Loads on staging | ✅ HTTP 200 |"; else echo "| Loads on staging | ❌ HTTP $status |"; fi
              echo "$c" | jq -r '"| Will be released at | \(.release_url) |"'
            fi
          fi
          if [ -z "${table:-}" ]; then echo "| | |"; echo "|---|---|"; fi
          echo "$c" | jq -r '"| Live for classrooms now | \(if .current then "`\(.current.version)` (approved \(.current.approved_at[0:10]))" else "nothing yet" end) |"'
          if [ "$ACTION" != approve ]; then
            echo "$c" | jq -r '"| After this run | `\(.version)` at \(.play_url)\(if .rollback then " (rollback)" else "" end) |"'
          fi
          echo
          echo "$c" | jq -r '.warnings[] | "> ⚠️ \(.)"'
          echo "$c" | jq -r '.problems[] | "> ❌ \(.)"'
        } >> "$S"
        if [ "$ACTION" != promote ] && [ "${status:-200}" != 200 ]; then echo "::error::The staging build doesn't load (HTTP $status)"; exit 1; fi
        if [ "$(echo "$c" | jq -r .ok)" != true ]; then
          echo "$c" | jq -r '.problems[] | "::error::\(.)"'
          exit 1
        fi
        echo "$c" | jq -r '.warnings[] | "::warning::\(.)"'

  release:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cdn.vaultlearninggames.org/${{ inputs.studio }}/${{ inputs.game }}/
    env:
      PUBLISHER: ${{ vars.VAULT_PUBLISHER_URL }}
      ACTION: ${{ inputs.action }}
      STUDIO: ${{ inputs.studio }}
      GAME: ${{ inputs.game }}
      VERSION: ${{ inputs.version }}
      REF: ${{ inputs.ref }}
    steps:
    - name: Release
      run: |
        set -euo pipefail
        token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vault-publisher" | jq -r .value)
        call() {
          body=$(jq -n --arg s "$STUDIO" --arg g "$GAME" --arg v "$VERSION" --arg r "$REF" \
            '{studio: $s, game: $g, version: $v} + (if $r == "" then {} else {ref: $r} end)')
          res=$(curl -sS -w '\n%{http_code}' -X POST "$PUBLISHER/v1/admin/releases/$1" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$body")
          code=$(echo "$res" | tail -1); json=$(echo "$res" | sed '$d')
          echo "$json" | jq . || echo "$json"
          if [ "$code" != 200 ]; then echo "::error::$1 failed (HTTP $code): $(echo "$json" | jq -r .error)"; exit 1; fi
        }
        if [ "$ACTION" != promote ]; then
          call approve
          echo "::notice title=Approved $GAME $VERSION::https://cdn.vaultlearninggames.org/$STUDIO/$GAME/$VERSION/"
          echo "### ✅ Approved \`$GAME\` $VERSION → https://cdn.vaultlearninggames.org/$STUDIO/$GAME/$VERSION/" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$ACTION" != approve ]; then
          call promote
          echo "::notice title=$GAME now plays $VERSION::https://cdn.vaultlearninggames.org/$STUDIO/$GAME/"
          echo "### 🎮 \`$GAME\` now plays $VERSION → https://cdn.vaultlearninggames.org/$STUDIO/$GAME/" >> "$GITHUB_STEP_SUMMARY"
        fi
