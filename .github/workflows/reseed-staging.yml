name: Re-seed staging's database

# Replaces the staging portal's database with a copy of production's, daily and on demand: staging is for testing
# code, layouts and the process, never content, so what is saved there is discarded and content flows production →
# staging only (docs/setup.md "Re-seeding staging's database").
#
#   gh workflow run reseed-staging.yml -R VaultLearningGames/vault-publisher
#
# It changes nothing but one variable on staging's Cloud Run service, LITESTREAM_RESEED (this run's id), which starts a
# new revision of the same image. docker-entrypoint.sh, seeing a new id, restores production's Litestream replica
# (staging's service account only has read access to that bucket) in place of staging's own, and replicates the copy to
# staging's bucket. The next deploy drops the variable, and with it nothing is re-seeded until the next run.
#
# The database says which release each game plays, but the files are in production's CDN bucket only, so the last
# step copies the current releases (and listing images) from production's CDN bucket into staging's: one way, never
# deleting, skipping what staging already has (scripts/reseed-cdn.ts, docs/staging-reseed.md). Without it every
# game hosted on the Vault CDN 404s in staging's player.
on:
  schedule:
  - cron: '17 9 * * *'   # daily, 09:17 UTC (early morning in Wisconsin)
  workflow_dispatch:

# Shares the staging deploy's group (deploy.yml), so a re-seed never runs alongside a deploy of staging.
concurrency:
  group: Deploy (portal)-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  reseed:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
    # Only ever staging, and only ever from production's bucket into staging's.
    - name: Check the variables are staging's
      env:
        SERVICE: ${{ vars.SERVICE }}
        LITESTREAM_BUCKET: ${{ vars.LITESTREAM_BUCKET }}
        LITESTREAM_SEED_BUCKET: ${{ vars.LITESTREAM_SEED_BUCKET }}
        PORTAL_URL: ${{ vars.PORTAL_URL }}
      run: |
        set -eu
        [ "$SERVICE" = vault-publisher-staging ] || { echo "::error::SERVICE is '$SERVICE', not vault-publisher-staging"; exit 1; }
        case "$LITESTREAM_BUCKET" in *staging*) ;; *) echo "::error::LITESTREAM_BUCKET '$LITESTREAM_BUCKET' isn't staging's"; exit 1 ;; esac
        case "$LITESTREAM_SEED_BUCKET" in ""|*staging*) echo "::error::LITESTREAM_SEED_BUCKET '$LITESTREAM_SEED_BUCKET' isn't production's"; exit 1 ;; esac
        case "$PORTAL_URL" in *staging*) ;; *) echo "::error::PORTAL_URL '$PORTAL_URL' isn't staging's"; exit 1 ;; esac

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@v3

    # Same image, same everything else: a new revision whose start re-seeds. gcloud waits until it serves; if it can't
    # start (for example production's replica can't be read), the running revision keeps serving and this fails.
    - name: Start a revision that re-seeds
      env:
        SERVICE: ${{ vars.SERVICE }}
        REGION: ${{ vars.GCP_REGION }}
        PROJECT: ${{ vars.GCP_PROJECT_ID }}
        RESEED: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -eu
        gcloud run services update "$SERVICE" --region "$REGION" --project "$PROJECT" --update-env-vars "LITESTREAM_RESEED=$RESEED"
        echo "Re-seeded $SERVICE from production as $RESEED" >> "$GITHUB_STEP_SUMMARY"

    - name: Check the portal answers
      env:
        PORTAL_URL: ${{ vars.PORTAL_URL }}
      run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$PORTAL_URL/health"

    # The database is re-seeded by now; this only adds files to staging's CDN bucket. Production's bucket is read with
    # a read-only R2 token. If a key can't be read, the step fails with what is missing (docs/staging-reseed.md).
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci
    - name: Copy production's releases to staging's CDN
      env:
        SERVICE: ${{ vars.SERVICE }}
        PROJECT: ${{ vars.GCP_PROJECT_ID }}
        R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
        CDN_BUCKET: ${{ vars.CDN_BUCKET }}
        SEED_CDN_BUCKET: ${{ vars.SEED_CDN_BUCKET }}
      run: |
        set -eu
        secret() {
          v=$(gcloud secrets versions access latest --secret="$1" --project "$PROJECT" 2>/dev/null) || {
            echo "::error::can't read the Secret Manager secret $1. Staging's CDN copy needs vault-publisher-staging-r2-cdn-* (staging's bucket) and vault-publisher-staging-r2-seed-cdn-* (an R2 'Object Read only' token on production's CDN bucket), with roles/secretmanager.secretAccessor on each for the deploy service account; see docs/staging-reseed.md" >&2
            exit 1
          }
          printf '%s' "$v"
        }
        R2_CDN_ACCESS_KEY_ID=$(secret "$SERVICE-r2-cdn-access-key-id")
        R2_CDN_SECRET_ACCESS_KEY=$(secret "$SERVICE-r2-cdn-secret-access-key")
        R2_SEED_CDN_ACCESS_KEY_ID=$(secret "$SERVICE-r2-seed-cdn-access-key-id")
        R2_SEED_CDN_SECRET_ACCESS_KEY=$(secret "$SERVICE-r2-seed-cdn-secret-access-key")
        for v in "$R2_CDN_ACCESS_KEY_ID" "$R2_CDN_SECRET_ACCESS_KEY" "$R2_SEED_CDN_ACCESS_KEY_ID" "$R2_SEED_CDN_SECRET_ACCESS_KEY"; do echo "::add-mask::$v"; done
        export R2_CDN_ACCESS_KEY_ID R2_CDN_SECRET_ACCESS_KEY R2_SEED_CDN_ACCESS_KEY_ID R2_SEED_CDN_SECRET_ACCESS_KEY
        node scripts/reseed-cdn.ts --summary "$GITHUB_STEP_SUMMARY"
