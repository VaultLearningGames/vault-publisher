name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes the website's hosting files (_headers, _redirects): test/site-hosting.test.ts. The site's build and
      # its Worker configuration live in VaultLearningGames/vault-site.
      - run: npm test
      - run: bash -n scripts/cloudflare-site-hosts.sh scripts/cloudflare-site-rules.sh
