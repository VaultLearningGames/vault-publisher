name: Unity WebGL preview

# Reusable all-in-one: unity-build.yml + publish-preview.yml. Every push builds WebGL and publishes it to
# https://cdn.vaultlearninggames-staging.org/fieldday/GAME/BRANCH/ ; deleting a branch removes its preview.
# Use the two workflows directly if you need to add your own jobs between or alongside them.
#
# Caller (e.g. .github/workflows/webgl.yml in fielddaylab/wake):
#
#   on: { push: {}, delete: {}, workflow_dispatch: {} }
#   permissions: { contents: read, id-token: write }
#   jobs:
#     webgl:
#       uses: VaultLearningGames/vault-publisher/.github/workflows/unity-webgl.yml@v1
#       with: { game: aqualab }
#       secrets: inherit
on:
  workflow_call:
    inputs:
      game:
        description: Game slug on the CDN, e.g. "aqualab".
        required: true
        type: string
      project-path:
        type: string
        default: .
      publisher-url:
        description: Overrides the VAULT_PUBLISHER_URL organization variable.
        type: string
        default: ''
    secrets:
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false
      UNITY_SERIAL:
        required: false
      UNITY_LICENSE:
        required: false
    outputs:
      url:
        description: Public URL of the published preview.
        value: ${{ jobs.preview.outputs.url }}

jobs:
  build:
    if: github.event_name != 'delete'
    uses: VaultLearningGames/vault-publisher/.github/workflows/unity-build.yml@v1
    with:
      project-path: ${{ inputs.project-path }}
    secrets: inherit

  preview:
    needs: build
    uses: VaultLearningGames/vault-publisher/.github/workflows/publish-preview.yml@v1
    with:
      game: ${{ inputs.game }}
      artifact: ${{ needs.build.outputs.artifact }}
      publisher-url: ${{ inputs.publisher-url }}

  remove-preview:
    if: github.event_name == 'delete'
    uses: VaultLearningGames/vault-publisher/.github/workflows/publish-preview.yml@v1
    with:
      game: ${{ inputs.game }}
      publisher-url: ${{ inputs.publisher-url }}
