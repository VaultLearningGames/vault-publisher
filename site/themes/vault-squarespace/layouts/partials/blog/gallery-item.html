{{- /* One image of a post's image collection (partials/blog/block.html and shortcodes/image.html): a <figure> with the
       image, linked when it has a link (target="_blank" with rel="noopener noreferrer" for a new window), and its
       title and description as the caption where they are shown. Context: dict url alt title description
       showTitle showDescription link blank, plus attrs (data-* for the shortcode's figures, already safe). */ -}}
{{- $cap := or (and .showTitle .title) (and .showDescription .description) -}}
<figure class="blog-gallery-item"{{ with .attrs }} {{ . }}{{ end }}>
{{- if .link }}<a class="blog-gallery-link" href="{{ .link }}"{{ if .blank }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ end -}}
<img src="{{ .url }}" alt="{{ .alt }}" loading="lazy">
{{- if .link }}</a>{{ end -}}
{{- if $cap }}<figcaption>{{ if and .showTitle .title }}<span class="blog-gallery-title">{{ .title }}</span>{{ end }}{{ if and .showDescription .description }}<span class="blog-gallery-desc">{{ .description }}</span>{{ end }}</figcaption>{{ end -}}
</figure>
{{- /**/ -}}
